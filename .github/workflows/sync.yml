name: Sync cursor/plugins pstack

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: Cursor commit to summarise from (skips the sync)
        required: false
      to:
        description: Cursor commit to summarise to
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !inputs.from }}
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.range.outputs.from }}
      to: ${{ steps.range.outputs.to }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Fetch cursor/plugins
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/cursor/plugins.git "$RUNNER_TEMP/cursor"
          git -C "$RUNNER_TEMP/cursor" sparse-checkout set harness/pstack
          git -C "$RUNNER_TEMP/cursor" checkout --quiet main

      - name: Record the Cursor commits this sync spans
        id: range
        run: |
          echo "from=$(cat .github/cursor-commit)" >> "$GITHUB_OUTPUT"
          echo "to=$(git -C "$RUNNER_TEMP/cursor" log -1 --format=%H -- pstack harness/pstack)" >> "$GITHUB_OUTPUT"

      - name: Copy Cursor's Claude Code tree
        env:
          TO: ${{ steps.range.outputs.to }}
        run: |
          .github/scripts/sync.sh "$RUNNER_TEMP/cursor"
          echo "$TO" > .github/cursor-commit

      - name: Commit and push
        env:
          TO: ${{ steps.range.outputs.to }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "main already matches cursor/plugins @ ${TO::7}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync cursor/plugins @ ${TO::7} ($(jq -r .version plugin.json))"
          git push origin HEAD:main

  digest:
    needs: sync
    if: ${{ always() && (inputs.from || (needs.sync.result == 'success' && needs.sync.outputs.from != needs.sync.outputs.to)) }}
    runs-on: ubuntu-latest
    env:
      FROM: ${{ inputs.from || needs.sync.outputs.from }}
      TO: ${{ inputs.to || needs.sync.outputs.to }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Fetch cursor/plugins history
        run: git clone --quiet --filter=blob:none --no-checkout https://github.com/cursor/plugins.git "$RUNNER_TEMP/cursor"

      - name: Summarise Lauren's changes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run .github/scripts/digest.py "$FROM" "$TO" "$RUNNER_TEMP/cursor" "$RUNNER_TEMP"

      - name: Open the digest issue
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/body.md"

  report-failure:
    needs: [sync, digest]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the failure issue
        run: |
          title="pstack sync failed"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Failed again: $RUN"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" --title "$title" \
              --body "The nightly sync or digest failed: $RUN. Close this issue once a run passes."
          fi
