name: Sync backnotprop/pstack

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch backnotprop/pstack
        run: |
          git remote add michael https://github.com/backnotprop/pstack.git
          git fetch michael main upstream

      - name: Set upstream to michael/upstream
        run: git push --force origin refs/remotes/michael/upstream:refs/heads/upstream

      - name: Merge michael/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit michael/main
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "main already contains michael/main"
            exit 0
          fi
          version=$(jq -r .version plugin.json)
          sed -i "s/^version: .*/version: ${version}/" apm.yml
          rm -rf .apm/agents
          cp -r agents .apm/agents
          git add apm.yml .apm/agents
          git commit -m "Sync backnotprop/pstack @ $(git rev-parse --short michael/main) (${version})"

      - name: Push
        run: git push origin HEAD:main

      - name: Check .apm/ covers everything pstack ships
        run: |
          diff -r agents .apm/agents
          for manifest in plugin.json .cursor-plugin/plugin.json; do
            jq -e 'keys - ["$schema", "name", "displayName", "version", "description", "author", "homepage", "repository", "license", "logo", "keywords", "category", "tags", "skills", "agents"] == []' "$manifest"
          done
          jq -e '.skills == "./skills/" and .agents == "./agents/"' .cursor-plugin/plugin.json
          unknown=$(git ls-tree --name-only HEAD | grep -vxE '\.apm|\.cursor-plugin|\.github|\.gitignore|agents|apm\.yml|assets|automations|docs|LICENSE|MIRROR\.md|plugin\.json|README\.md|skills' || true)
          if [ -n "$unknown" ]; then
            echo "::error::New top-level entries that .apm/ may not cover: $unknown"
            exit 1
          fi
